[project]
name = "alko-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "mcp_servers/*"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "httpx>=0.27"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # ruff format owns line length

[tool.ruff.lint.isort]
known-first-party = ["alko_backend", "alko_mcp_*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "mcp_servers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
