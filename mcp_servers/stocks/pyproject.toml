[project]
name = "alko-mcp-stocks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp>=1.2", "yfinance>=0.2.50", "pandas>=2.2"]

[project.scripts]
alko-mcp-stocks = "alko_mcp_stocks.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alko_mcp_stocks"]
