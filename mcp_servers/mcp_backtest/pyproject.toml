[project]
name = "alko-mcp-backtest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp>=1.2", "yfinance>=0.2.50", "pandas>=2.2", "numpy>=1.26", "alko-mcp-macro"]

[project.scripts]
alko-mcp-backtest = "alko_mcp_backtest.server:main"

[tool.uv.sources]
alko-mcp-macro = { workspace = true }  # shared FRED client

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alko_mcp_backtest"]
