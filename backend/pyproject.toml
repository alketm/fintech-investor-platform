[project]
name = "alko-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anthropic[mcp]>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "mcp>=1.2",
  "alko-mcp-etf",
  "alko-mcp-stocks",
  "alko-mcp-news",
  "alko-mcp-financials",
  "alko-mcp-backtest",
  "alko-mcp-event-study",
  "alko-mcp-institutional",
]

[tool.uv.sources]
alko-mcp-etf = { workspace = true }
alko-mcp-stocks = { workspace = true }
alko-mcp-news = { workspace = true }
alko-mcp-financials = { workspace = true }
alko-mcp-backtest = { workspace = true }
alko-mcp-event-study = { workspace = true }
alko-mcp-institutional = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alko_backend"]
